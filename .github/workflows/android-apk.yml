name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Instalar Java 21 (requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Crear el proyecto Android si no existe
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Poner el icono de la app
        run: node build/android-icons.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar app-debug.apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropocket-99in1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
