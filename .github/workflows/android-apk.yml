name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas automáticas: si fallan, no se compila el APK ni se publica la web.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas en Node (catálogo, récords, logros, sonido y los 99 cartuchos)
        run: npm test

      - name: Recuperar Chromium de la caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium para las pruebas en el navegador
        run: npx playwright install --with-deps --only-shell chromium

      - name: Pruebas en el navegador (la consola entera con Playwright)
        run: npm run test:e2e

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Instalar Java 21 (requerido por Capacitor 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Firma fija: Android solo deja instalar una versión encima de otra si las dos tienen la misma firma.
      # Si el repositorio tiene el secreto ANDROID_DEBUG_KEYSTORE (keystore en base64) se usa ese;
      # si no, la clave de depuración se genera una vez y se guarda en la caché de GitHub Actions.
      - name: Recuperar la clave de firma guardada
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: retropocket-debug-keystore-v1

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando la clave del secreto ANDROID_DEBUG_KEYSTORE"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 18250 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Clave nueva generada; se guarda en la caché para las próximas compilaciones"
          else
            echo "Usando la clave guardada en la caché"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 "SHA256" || true

      - name: Guardar la clave de firma en la caché
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: retropocket-debug-keystore-v1

      - name: Crear el proyecto Android si no existe
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # versionCode sube en cada compilación (Android exige que crezca para actualizar)
      # y versionName es la versión de package.json.
      - name: Poner la versión de la app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Poner el icono de la app
        run: node build/android-icons.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar app-debug.apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropocket-99in1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Versión web en GitHub Pages (https://<usuario>.github.io/RetroPocket/) en cada push a main.
  # Hay que activarla una vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
  # Mientras no esté activada, este paso lo avisa y no publica nada (el workflow sigue en verde).
  web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Comprobar que GitHub Pages está activada
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          if echo "$info" | grep -q '"build_type": *"workflow"'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versión web sin publicar::Activa GitHub Pages en Settings → Pages → Source: GitHub Actions y la próxima compilación de main la publicará."
          fi

      - name: Preparar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Subir la web
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
