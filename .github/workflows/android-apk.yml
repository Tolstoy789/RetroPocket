name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas automáticas: si fallan, no se compila el APK.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas en Node (catálogo, récords, logros, sonido y los 99 cartuchos)
        run: npm test

      - name: Recuperar Chromium de la caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium para las pruebas en el navegador
        run: npx playwright install --with-deps --only-shell chromium

      - name: Pruebas en el navegador (la consola entera con Playwright)
        run: npm run test:e2e

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # para publicar el APK en Releases

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (Vite)
        run: npm run build

      - name: Instalar Java 21 (requerido por Capacitor 8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Firma fija: Android solo deja instalar una versión encima de otra si las dos tienen la misma firma.
      # Si el repositorio tiene el secreto ANDROID_DEBUG_KEYSTORE (keystore en base64) se usa ese;
      # si no, la clave de depuración se genera una vez y se guarda en la caché de GitHub Actions.
      - name: Recuperar la clave de firma guardada
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: retropocket-debug-keystore-v1

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando la clave del secreto ANDROID_DEBUG_KEYSTORE"
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 18250 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Clave nueva generada; se guarda en la caché para las próximas compilaciones"
          else
            echo "Usando la clave guardada en la caché"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 "SHA256" || true

      - name: Guardar la clave de firma en la caché
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: retropocket-debug-keystore-v1

      - name: Crear el proyecto Android si no existe
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # versionCode sube en cada compilación (Android exige que crezca para actualizar)
      # y versionName es la versión de package.json.
      - name: Poner la versión de la app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Poner el icono de la app
        run: node build/android-icons.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar app-debug.apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retropocket-99in1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # En main, el APK se publica también en Releases: una release por versión (v0.17.0...) con el
      # archivo RetroPocket-99in1.apk, así que este enlace baja siempre el último:
      # https://github.com/<usuario>/RetroPocket/releases/latest/download/RetroPocket-99in1.apk
      # Si se compila otra vez la misma versión, se cambia el APK de su release.
      - name: Publicar el APK en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk RetroPocket-99in1.apk
          LATEST="https://github.com/$GH_REPO/releases/latest/download/RetroPocket-99in1.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" RetroPocket-99in1.apk --clobber
          else
            printf '%s\n' \
              "RetroPocket 99-in-1 $VERSION (compilación ${{ github.run_number }})." \
              "" \
              "Descarga **RetroPocket-99in1.apk** en el móvil y ábrelo para instalarlo. Se instala encima de la versión anterior sin perder los récords." \
              "" \
              "La última versión siempre está en $LATEST" > notes.md
            gh release create "$TAG" RetroPocket-99in1.apk --target "$GITHUB_SHA" \
              --title "RetroPocket 99-in-1 $VERSION" --notes-file notes.md --latest
          fi
          echo "::notice title=APK publicado::$LATEST"
